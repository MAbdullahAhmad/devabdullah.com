name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: devabdullah-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            project/frontend/package-lock.json
            project/rev-proxy/package-lock.json

      - name: Verify frontend
        working-directory: project/frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://dev.devabdullah.com
          SITE_INDEXABLE: "false"
        run: |
          set -Eeuo pipefail
          npm ci --include=dev --ignore-scripts
          npm run check

      - name: Verify reverse proxy source
        working-directory: project/rev-proxy
        run: |
          set -Eeuo pipefail
          npm ci --include=dev --ignore-scripts
          npm run typecheck
          npm test

  deploy-dev:
    needs: verify
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy every main commit to development
        env:
          PROCESS_EXECUTOR_URL: ${{ vars.PROCESS_EXECUTOR_URL }}
          PROCESS_EXECUTOR_TOKEN: ${{ secrets.PROCESS_EXECUTOR_TOKEN }}
          PROCESS_EXECUTOR_PROJECT: devabdullah
          PROCESS_EXECUTOR_WAIT_SECONDS: 5
        run: ./server-control.bash deploy dev "$GITHUB_SHA"

  deploy-prod:
    needs: [verify, deploy-dev]
    if: github.event.head_commit.message == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy exact commit to production
        env:
          PROCESS_EXECUTOR_URL: ${{ vars.PROCESS_EXECUTOR_URL }}
          PROCESS_EXECUTOR_TOKEN: ${{ secrets.PROCESS_EXECUTOR_TOKEN }}
          PROCESS_EXECUTOR_PROJECT: devabdullah
          PROCESS_EXECUTOR_WAIT_SECONDS: 5
        run: ./server-control.bash deploy prod "$GITHUB_SHA"
